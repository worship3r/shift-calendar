<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교대달력</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#ffffff; --soft:#f5f6f8; --ink:#1d232b; --sub:#7d8794; --line:#eceef1; --faint:#c3c8cf;
  --A:#e3bf62; --B:#7d9bd6; --C:#a19bc4; --R:#e0876c;
  --sun:#d63b3b; --sat:#3d6fd6; --accent:#2f6fec; --todaybg:#eaf2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{overflow-x:clip}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,sans-serif}
body{max-width:1400px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:none}
button{font-family:inherit;color:inherit}
/* 머리 */
.bar{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  position:sticky;top:0;background:var(--bg);z-index:3}
.bar .ym{font-size:23px;font-weight:700;white-space:nowrap;padding:4px 2px;border:0;background:none}
.bar .arr{border:0;background:none;font-size:24px;color:var(--sub);width:30px;height:40px;flex:none}
.todayp{border:1.5px solid var(--ink);background:none;border-radius:16px;padding:3px 10px;font-size:14px;flex:none;margin-left:2px}
.bk{display:none;align-items:center;gap:8px;margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:#fff4e5;font-size:15px}
.bk.show{display:flex}
.bk span{flex:1}
.bk button{border:0;background:#e8590c;color:#fff;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600}
.bar .sp{flex:1}
.icon{border:0;background:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.icon svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon:active{background:var(--soft)}
/* 달력 */
.dows{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.dows div{text-align:center;font-size:15px;padding:6px 0;color:var(--sub)}
.dows .su{color:var(--sun)} .dows .sa{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);touch-action:pan-y;will-change:transform}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:var(--rowh,108px);padding:0 0 5px;
  overflow:hidden;cursor:pointer;position:relative;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.other{background:#f6f7f8}
.cell.other>*{opacity:.33}
.cell.today{background:#f4f8ff}
.cell.pick{box-shadow:inset 0 0 0 2px var(--accent)}
.top{display:flex;align-items:center;gap:4px;padding:3px 5px;min-height:26px}
.sb{position:relative;overflow:hidden;margin:1px 3px 2px;height:22px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;
  padding-left:5px;font-size:13px;font-weight:700;letter-spacing:.3px;background:linear-gradient(90deg,var(--g1),var(--g2) 85%)}
.sb.sm{flex:none;margin:0 0 0 auto;height:18px;min-width:20px;padding:0 3px 0 6px;font-size:11px;border-radius:4px;letter-spacing:0}
.sb.sm::before{width:3px}
.top .hin + .sb.sm{margin-left:6px}
.sb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ac)}
.sb.A{--g1:var(--Abg2);--g2:var(--Abg);color:var(--Afg);--ac:var(--A)} .sb.B{--g1:var(--Bbg2);--g2:var(--Bbg);color:var(--Bfg);--ac:var(--B)}
.sb.C{--g1:var(--Cbg2);--g2:var(--Cbg);color:var(--Cfg);--ac:var(--C)} .sb.R{--g1:var(--Rbg2);--g2:var(--Rbg);color:var(--Rfg);--ac:var(--R)}
body.round .sb::before{display:none}
.sb.chg{outline:1.5px solid currentColor;outline-offset:-1.5px}
body.round .sb{width:22px;margin:1px auto 2px;border-radius:50%;box-shadow:none;padding:0;color:#fff;font-size:12px}
body.round .sb.A{background:var(--A)} body.round .sb.B{background:var(--B)} body.round .sb.C{background:var(--C)} body.round .sb.R{background:var(--R)}
.hin{font-size:12px;line-height:14px;color:var(--sun);font-weight:600;min-width:0;margin-left:auto;text-align:right;word-break:keep-all}
.cell.hd .top,.cell.hd .hn{background:#fae3e3}
@media (max-width:420px){ .hin{display:none} }
@media (min-width:421px){ .hn{display:none} }
.hn{font-size:10px;line-height:12px;color:var(--sun);padding:0 4px 2px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.stag{font-size:12px;font-weight:700;line-height:18px;min-width:20px;padding:0 4px;border-radius:5px;text-align:center;flex:none}
.stag.A{background:var(--Abg);color:var(--Afg)} .stag.B{background:var(--Bbg);color:var(--Bfg)} .stag.C{background:var(--Cbg);color:var(--Cfg)} .stag.R{background:var(--Rbg);color:var(--Rfg)}
body.round .stag{border-radius:50%;width:20px;padding:0;color:#fff}
body.round .stag.A{background:var(--A)} body.round .stag.B{background:var(--B)} body.round .stag.C{background:var(--C)} body.round .stag.R{background:var(--R)}
.stag.chg{box-shadow:inset 0 0 0 1.5px currentColor}
.ml{font-size:12px;line-height:14px;padding:0 3px;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.tn{display:none}
.ml b{font-size:11px;color:inherit;font-weight:700;margin-right:3px}
.mrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.tbtn{flex:none;border:1px dashed var(--faint);background:none;border-radius:10px;padding:10px 10px;font-size:15px;color:var(--sub);white-space:nowrap}
.tsel{flex:none;display:flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px 2px 3px 4px}
.tsel select{border:0;background:none;font-size:16px;font-family:inherit;color:var(--ink);padding:6px 0;-webkit-appearance:none;appearance:none;text-align:center}
.tsel .tx{border:0;background:none;color:var(--sub);font-size:16px;width:24px;height:30px}
.mrow .mx{flex:1;min-width:0;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-family:inherit;color:var(--ink)}
.mrow .x{background:var(--soft)}
.addm{width:100%;border:1px dashed var(--faint);background:none;border-radius:10px;padding:10px;font-size:15px;color:var(--sub)}
.num{font-size:18px;font-weight:500;line-height:21px;flex:none}
.num.su{color:var(--sun)} .num.sa{color:var(--sat)}
.cell.today .num{background:var(--accent);color:#fff;border-radius:6px;padding:0 4px}
.hol{font-size:10px;color:var(--sun);line-height:11px;text-align:right;word-break:keep-all;min-width:0}
.circ{width:34px;height:34px;border-radius:50%;margin:5px auto 4px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:16px}
.circ.A{background:var(--A)} .circ.B{background:var(--B)} .circ.C{background:var(--C)} .circ.R{background:var(--R)}
body:not(.round) .circ{width:auto;height:30px;margin:5px 4px 4px;border-radius:8px;font-size:17px}
body:not(.round) .circ.A{background:var(--Abg);color:var(--Afg)} body:not(.round) .circ.B{background:var(--Bbg);color:var(--Bfg)}
body:not(.round) .circ.C{background:var(--Cbg);color:var(--Cfg)} body:not(.round) .circ.R{background:var(--Rbg);color:var(--Rfg)}
body:not(.round) .circ.chg{box-shadow:inset 0 0 0 2px currentColor}
body:not(.round) .wk .circ{width:auto;height:28px;margin:0 3px;align-self:stretch;justify-self:stretch;margin:8px 3px}
.circ.chg{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.memo{font-size:12px;line-height:14px;text-align:center;padding:0 2px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lv::before,.sel::before,.pill::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}
.lv::before{width:3px}
.sel,.pill{position:relative;overflow:hidden}
.pill{padding-left:14px}
.sel{padding-left:14px}
.lv{position:relative;overflow:hidden;font-size:13.5px;line-height:18px;text-align:center;margin:2px 3px 0;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.05);font-weight:600;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.round .syncst{font-size:13px;white-space:nowrap}
.syncst.ok{color:#2b8a3e} .syncst.err{color:var(--sun)}
.cfield{width:100%;font-size:18px;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:inherit}
.hashbox{font-family:monospace;font-size:12px;word-break:break-all;background:var(--soft);border-radius:8px;padding:8px;margin-top:8px;color:var(--sub)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:var(--sub);font-size:14px}
.foot button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 14px;font-size:15px}
@media (max-width:420px){ .bar{gap:2px;padding-left:6px;padding-right:4px} .bar .icon{width:34px;height:40px} .bar .icon svg{width:22px;height:22px} .bar .arr{width:22px} .bar .ym{font-size:20px} .todayp{padding:2px 8px;font-size:13px} .hol{word-break:break-all;font-size:9px;line-height:10px} .ml{margin-top:2px;font-size:13.5px;line-height:16px;padding:0 2px;letter-spacing:-.5px;overflow-wrap:normal;word-break:keep-all;overflow:hidden} .ml b{font-size:13px;margin-right:2px} }
@media (min-width:600px){
  body:not(.round) .circ{height:34px;font-size:19px;margin:4px 8px}
  .cell{height:var(--rowh,124px)} .circ{width:42px;height:42px;font-size:19px}
  .memo{font-size:14px;line-height:17px} .lv{font-size:17px;line-height:24px;border-radius:7px;margin:2px 6px 0;padding-left:6px} .lv::before{width:5px} .hol{font-size:12px;line-height:13px}
  .num{font-size:19px}
  .stag{font-size:14px;line-height:21px;min-width:26px;padding:0 6px} body.round .stag{width:24px;min-width:24px}
  .sb{height:28px;margin:2px 6px 3px;font-size:16px;border-radius:7px;padding-left:7px} .sb::before{width:7px}
  .sb.sm{height:22px;min-width:56px;margin:0 0 0 auto;font-size:14px;padding-left:10px;border-radius:6px} .sb.sm::before{width:5px} body.round .sb{width:28px;height:28px;font-size:14px} .top{padding:4px 8px;min-height:28px}
  .ml{font-size:18px;line-height:22px;padding:0 6px;margin-top:3px} .ml b{font-size:17px} .hn{font-size:12px;line-height:14px;padding:0 6px}
}
/* 전체 조 */
.grid.all{display:block}
.wk{display:grid;grid-template-columns:44px repeat(7,1fr)}
.wk>div{display:grid;place-items:center;min-width:0}
.wk .dr{height:36px;font-size:17px;font-weight:600;border-top:2px solid var(--line);cursor:pointer;text-align:center}
.wk .dr.su{color:var(--sun)} .wk .dr.sa{color:var(--sat)} .wk .dr.other{opacity:.32}
.wk .dr .h{display:block;font-size:9px;font-weight:400;line-height:10px;color:var(--sun);word-break:keep-all;overflow-wrap:anywhere;max-width:48px}
.wk .tl{font-size:14px;color:var(--sub);border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:44px}
.wk .tc{height:44px;border-bottom:1px solid var(--line);cursor:pointer}
.wk .me{background:#fffbe3}
.wk .dr.hb{background:#fae3e3}
.wk .tl.me{color:var(--ink);font-weight:700}
.wk .tc.today{background:#f4f8ff}
.wk .tc.pick{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.wk .dr.pick>span{background:var(--accent);color:#fff;border-radius:7px;padding:1px 5px}
.wk .dr.pick .h{color:#fff}
.wk .tc.other .circ{opacity:.32}
.wk .circ{width:28px;height:28px;font-size:13px;margin:0}
@media (min-width:600px){ .wk{grid-template-columns:64px repeat(7,1fr)} .wk .tc,.wk .tl{height:52px} .wk .circ{width:36px;height:36px;font-size:16px} .wk .dr .h{font-size:11px;line-height:12px;max-width:none} }
/* 아래 창 */
.sheet{position:fixed;inset:0;background:rgba(20,24,30,.42);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.panel h2{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;color:var(--sun);background:#fdeaea;border-radius:6px;padding:2px 8px}
.lab{font-size:15px;color:var(--sub);margin:16px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 13px;font-size:16px;display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip .d{width:12px;height:12px;border-radius:50%}
.sel{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;margin-bottom:6px}
.sel .nm{flex:1;font-size:17px;font-weight:600}
.sel .lvval{min-width:64px;text-align:center;font-size:16px}
.qh{display:flex;gap:6px;margin:-2px 0 10px}
.qh button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-size:14px;color:var(--ink)}
.sel input{width:76px;font-size:17px;padding:6px;border-radius:8px;border:1px solid rgba(0,0,0,.15);text-align:center;background:rgba(255,255,255,.85)}
.x{border:0;background:rgba(255,255,255,.7);width:34px;height:34px;border-radius:50%;font-size:18px}
textarea{width:100%;min-height:96px;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--soft);font-family:inherit;color:var(--ink);resize:vertical}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;font-size:18px;padding:14px 0;border-radius:12px;border:0;font-weight:600}
.pri{background:var(--accent);color:#fff} .sec{background:var(--soft)}
/* 휴가 현황 */
.lsum{margin:4px 10px 0;padding-bottom:8px;position:relative}
.lsum .hd{margin:0 2px 4px}
.lsumtot{margin-left:10px;font-size:14px;color:var(--sub);font-weight:400} .lsumtot b{font-size:15px;color:var(--ink)} .lsumtot .u{font-size:.7em;color:var(--sub)}
.lpace{margin-left:10px;font-size:14px;color:var(--sub);font-weight:400} .lpace b{font-size:15px;color:var(--ink);font-weight:700} .lpace small{font-size:14px;color:var(--sub);margin-left:3px}
.lpt{margin-left:10px;font-size:13px;font-weight:700;color:#8a5a00;background:#fdf0c8;border-radius:10px;padding:2px 9px;white-space:nowrap}
@media (max-width:600px){ .lpt{display:none} .lpace{display:none} .lsumtot{margin-left:6px;font-size:12.5px} .lsumtot b{font-size:13.5px} .lsum .hd .r b{font-size:15px} }
.lrow2{display:grid;grid-template-columns:repeat(var(--tn,4),1fr);gap:8px}
/* 5~6개: 여백·글자를 줄여 한 줄에 */
.lrow2.dense{gap:5px}
.lt2.gone{opacity:.45}
.lrow2.wrapgrid{display:grid!important}
.lrow2.dense .lt2{padding:6px 8px;gap:4px;border-radius:10px}
.lrow2.dense .lt2 .n{font-size:13px;gap:4px} .lrow2.dense .lt2 .n i{width:8px;height:8px}
.lrow2.dense .lt2 .v b{font-size:18px} .lrow2.dense .lt2 .v small{font-size:11px}
/* (5개까지: 설정에서 6개째는 막음) */
@media (max-width:600px){ .lrow2.dense .lt2 .v small.tot{display:none} .lrow2.dense .lt2{padding:5px 6px;gap:3px} .lrow2.dense .lt2 .n{font-size:12px} .lrow2.dense .lt2 .v b{font-size:16px} }
@media (max-width:420px){ .lrow2{flex-wrap:wrap} .lrow2.dense .lt2{padding:4px 5px;gap:2px} .lrow2.dense .lt2 .n{font-size:11px;letter-spacing:-.4px} .lrow2.dense .lt2 .n i{width:6px;height:6px} .lrow2.dense .lt2 .v b{font-size:14px} }
.lt2{position:relative;overflow:hidden;border:0;background:var(--soft);border-radius:12px;padding:6px 12px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;text-align:left;font-family:inherit;color:var(--ink);min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.lt2 .n{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lt2 .n i{width:10px;height:10px;border-radius:50%;flex:none}
.lt2 .v .u{font-size:.62em;font-weight:600;color:var(--sub);margin:0 1px}
.lt2 .v{white-space:nowrap;line-height:1.15;flex:none} .lt2 .v b{font-size:22px} .lt2 .v b.zero{color:var(--sun)} .lt2 .v small{font-size:13px;color:var(--sub);margin-left:1px}
@media (max-width:420px){ .lrow2{display:flex;gap:4px} .lt2{flex:1 1 auto;padding:5px 6px;gap:3px} .lt2 .n{font-size:11.5px;gap:2px;letter-spacing:-.4px;overflow:visible} .lt2 .n i{width:6px;height:6px} .lt2 .v b{font-size:15px;letter-spacing:-.3px} .lt2 .v small.tot{font-size:9.5px;margin-left:0} .lrow2:not(.dense) .lt2 .n i{display:none} .lrow2:not(.dense) .lt2{padding:5px 5px} .lrow2:not(.dense) .lt2 .n{font-size:11px} .lrow2.dense .lt2 .v small.tot{display:none} }
@media (max-width:600px){ .lt2{padding:5px 7px;border-radius:10px;gap:3px} .lt2 .n{font-size:12px;gap:3px;overflow:hidden} .lt2 .n i{width:7px;height:7px} .lt2 .v b{font-size:17px} .lt2 .v small{font-size:10.5px} }
.lsum .hd{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.lsum .hd b{font-size:16px}
.lsum .hd .syncst{margin-left:8px;font-weight:400}
.lsum .hd .r{display:flex;align-items:baseline;gap:4px;min-width:0}
.lsum .hd button{border:0;background:none;color:var(--sub);font-size:14px;padding:4px 0}
.tiles{display:grid;grid-template-columns:repeat(var(--tn,3),1fr);gap:8px}
@media (max-width:420px){ .tile{padding:8px 6px 8px 10px;box-shadow:inset 4px 0 0 var(--c)} .tile .nm i{display:none} .tile .v{font-size:23px} .tile .nm{font-size:13px} .tile .v small{font-size:12px} .tile .sn{font-size:10px;padding-left:3px} }
.tile{background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.tile .nm{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.tile .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.tile .v{font-size:26px;font-weight:700;margin-top:3px;line-height:1.1;white-space:nowrap}
.tile .v{display:flex;align-items:baseline}
.tile .sn{margin-left:auto;padding-left:6px;font-size:12px;font-weight:400;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .v small{font-size:14px;font-weight:400;color:var(--sub);margin-left:2px}

.tile .s{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:14px;color:var(--sub);padding:2px 2px 0}
.lline .lt1{color:var(--ink);font-size:14px}
.lline .lmore{margin-left:auto;border:0;background:none;color:var(--accent);font-size:14px;padding:2px 0}
.lline .syncst{margin-left:0}

<script>
// ───── 근무 순서 ─────
const CYCLE = [...'AAAAAA','R','R',...'BBBBBB','R','R',...'CCCCCC','R','R'];
const BASE = Date.UTC(2026,10,1)/864e5;          // 2026-11-01
const OFFSET = {1:2, 2:8, 3:14, 4:20};
const LABEL = {A:'A', B:'B', C:'C', R:'휴'};
const DOW = ['일','월','화','수','목','금','토'];
const dn = (y,m,d) => Date.UTC(y,m,d)/864e5;
const shiftOf = (t,n) => CYCLE[(((OFFSET[t]+n-BASE)%24)+24)%24];
const pad = v => String(v).padStart(2,'0');
const key = (y,m,d) => { const t = new Date(Date.UTC(y,m,d)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; };
const fromN = n => { const t = new Date(n*864e5); return [t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()]; };
const kOfN = n => key(...fromN(n));
const dowOfN = n => new Date(n*864e5).getUTCDay();

// ───── 공휴일 ─────
// ───── 음력 → 양력 (한국 시간 UTC+9 기준 천문 계산: 삭(합삭)과 중기로 달·윤달을 정함) ─────
const LUNAR_TZ = 9;
function jdFromDate(dd, mm, yy){
  const a = Math.floor((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
  return dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
}
function jdToDate(jd){
  const a = jd + 32044, b = Math.floor((4 * a + 3) / 146097), c = a - Math.floor(b * 146097 / 4);
  const d = Math.floor((4 * c + 3) / 1461), e = c - Math.floor(1461 * d / 4), m = Math.floor((5 * e + 2) / 153);
  return [e - Math.floor((153 * m + 2) / 5) + 1, m + 3 - 12 * Math.floor(m / 10), b * 100 + d - 4800 + Math.floor(m / 10)];
}
// 합삭 시각 (Meeus, Astronomical Algorithms 49장 전체 식, 오차 수 초). k는 1900년 기준 번호 → Meeus k = k - 1237
function lunNewMoon(k0){
  const k = k0 - 1237, T = k / 1236.85, T2 = T*T, T3 = T2*T, T4 = T3*T, dr = Math.PI / 180, sin = x => Math.sin(x * dr);
  let jde = 2451550.09766 + 29.530588861*k + 0.00015437*T2 - 0.000000150*T3 + 0.00000000073*T4;
  const E = 1 - 0.002516*T - 0.0000074*T2;
  const M = 2.5534 + 29.10535670*k - 0.0000014*T2 - 0.00000011*T3;
  const Mp = 201.5643 + 385.81693528*k + 0.0107582*T2 + 0.00001238*T3 - 0.000000058*T4;
  const F = 160.7108 + 390.67050284*k - 0.0016118*T2 - 0.00000227*T3 + 0.000000011*T4;
  const Om = 124.7746 - 1.56375588*k + 0.0020672*T2 + 0.00000215*T3;
  jde += -0.40720*sin(Mp) + 0.17241*E*sin(M) + 0.01608*sin(2*Mp) + 0.01039*sin(2*F) + 0.00739*E*sin(Mp-M)
    - 0.00514*E*sin(Mp+M) + 0.00208*E*E*sin(2*M) - 0.00111*sin(Mp-2*F) - 0.00057*sin(Mp+2*F) + 0.00056*E*sin(2*Mp+M)
    - 0.00042*sin(3*Mp) + 0.00042*E*sin(M+2*F) + 0.00038*E*sin(M-2*F) - 0.00024*E*sin(2*Mp-M) - 0.00017*sin(Om)
    - 0.00007*sin(Mp+2*M) + 0.00004*sin(2*Mp-2*F) + 0.00004*sin(3*M) + 0.00003*sin(Mp+M-2*F) + 0.00003*sin(2*Mp+2*F)
    - 0.00003*sin(Mp+M+2*F) + 0.00003*sin(Mp-M+2*F) - 0.00002*sin(Mp-M-2*F) - 0.00002*sin(3*Mp+M) + 0.00002*sin(4*Mp);
  const A = [[299.77,0.107408,-0.009173,0.000325],[251.88,0.016321,0,0.000165],[251.83,26.651886,0,0.000164],[349.42,36.412478,0,0.000126],
    [84.66,18.206239,0,0.000110],[141.74,53.303771,0,0.000062],[207.14,2.453732,0,0.000060],[154.84,7.306860,0,0.000056],
    [34.52,27.261239,0,0.000047],[207.19,0.121824,0,0.000042],[291.34,1.844379,0,0.000040],[161.72,24.198154,0,0.000037],
    [239.56,25.513099,0,0.000035],[331.55,3.592518,0,0.000023]];
  for (const [a, b, c, w] of A) jde += w * sin(a + b*k + c*T2);
  return jde - 70 / 86400;   // TT → UT (ΔT 약 70초)
}
function lunSunLong(jdn){
  const T = (jdn - 2451545.0) / 36525, T2 = T * T, dr = Math.PI / 180;
  const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
  const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
  const DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M) + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
  let L = (L0 + DL) * dr; L -= Math.PI * 2 * Math.floor(L / (Math.PI * 2)); return L;

// 매년 반복(rep) 종류는 기준 날짜가 들어 있는 해의 기간을 씀 (예: 연차 12/18 ~ 다음 해 12/17)
const addY = (k, n) => (+k.slice(0,4) + n) + k.slice(4);
const nextDay = k => { const [y,m,d] = k.split('-').map(Number); return key(y, m-1, d+1); };
// 날짜에 개월 더하기 (말일 넘치면 그 달 말일)
const addM = (k, n) => { const [y,m,d] = k.split('-').map(Number); const last = new Date(y, m-1+n+1, 0).getDate(); return key(y, m-1+n, Math.min(d, last)); };
const prevDay = k => { const [y,m,d] = k.split('-').map(Number); return key(y, m-1, d-1); };
function periodOf(t, ref){
  if (!t.rep || !t.start || !t.end) return {start: t.start, end: t.end};
  if (t.rep === 'half'){   // 반기: 시작일부터 6개월씩 (예: 1/1~6/30, 7/1~12/31)
    const [sy, sm] = t.start.split('-').map(Number), [ry, rm] = ref.split('-').map(Number);
    let n = Math.floor(((ry - sy) * 12 + (rm - sm)) / 6);
    if (ref < addM(t.start, 6*n)) n--;
    if (ref >= addM(t.start, 6*n + 6)) n++;
    return {start: addM(t.start, 6*n), end: prevDay(addM(t.start, 6*n + 6))};
  }
  let n = +ref.slice(0,4) - +t.start.slice(0,4);
  if (ref < addY(t.start, n)) n--;
  if (ref > addY(t.end, n)) n++;
  return {start: addY(t.start, n), end: addY(t.end, n)};
}
function usedOf(t, until, per){
  per = per || periodOf(t, until || key(T.y,T.m,T.d));
  let u = 0;
  for (const [k, day] of Object.entries(S.days)){
    if (per.start && k < per.start) continue;
    if (per.end && k > per.end) continue;
    if (until && k > until) continue;
    for (const l of day.leaves||[]) if (l.t===t.id) u += l.n;
  }
  return u;
}

  }

// ───── 디데이. 저장: S.an0, S.an1 … = "<반복><달력>|년|월|일|아이콘|이름"
//   반복 y 매년 · o 한 번 · m 매월 · w 매주, 달력 s 양력 · l 음력 (예: "ys|2014|11|30|💍|결혼기념일")
//   예전 형식("s|월|일|이름", "os|년|월|일|이름")도 읽음. 짧은 글자라 Worker 그대로 저장됨
const ANN_ICONS = ['🎂','🎁','💍','💰','❤️','✈️','📝','🏥','⭐'];   // 🎂 우리 생일, 🎁 부모님 생신
function getAnn(){
  return Object.keys(S).filter(k => /^an\d+$/.test(k)).sort((a, b) => a.slice(2) - b.slice(2)).map(k => {
    const p = String(S[k]).split('|');
    if (p[0].length === 1){ const [cal, m, d, ...n] = p; return {rep: 'y', cal: cal === 'l' ? 'l' : 's', y: 0, m: +m, d: +d, icon: '', name: n.join('|')}; }
    if (p.length === 5){ const [c, y, m, d, n] = p; return {rep: 'o', cal: c[1] === 'l' ? 'l' : 's', y: +y, m: +m, d: +d, icon: '', name: n}; }
    const [c, y, m, d, icon, ...n] = p;
    return {rep: 'yomw'.includes(c[0]) ? c[0] : 'y', cal: c[1] === 'l' ? 'l' : 's', y: +y || 0, m: +m, d: +d, icon: icon || '', name: n.join('|')};
  }).filter(a => a.m >= 1 && a.m <= 12 && a.d >= 1 && a.d <= 31 && a.name);
}
function setAnn(list){
  Object.keys(S).filter(k => /^an\d+$/.test(k)).forEach(k => delete S[k]);
  list.forEach((a, i) => S['an' + i] = `${a.rep}${a.rep === 'm' || a.rep === 'w' ? 's' : a.cal}|${a.y || 0}|${a.m}|${a.d}|${a.icon || ''}|${a.name.slice(0, 20).replace(/\|/g, ' ')}`);
  annCache = {}; save();
}
// 그 해의 날짜 (매년·한 번): 양력은 그대로(2/29는 평년 2/28), 음력은 계산
function annDate(a, y){
  if (a.rep === 'o' && y !== a.y) return null;
  if (a.cal === 's'){ const last = new Date(y, a.m, 0).getDate(); return key(y, a.m - 1, Math.min(a.d, last)); }
  let r = lunarToSolar(y, a.m, a.d);
  if (r && a.d === 30){ const nx = a.m === 12 ? lunarToSolar(y + 1, 1, 1) : lunarToSolar(y, a.m + 1, 1); if (nx && r.join() === nx.join()) r = lunarToSolar(y, a.m, 29); }   // 30일 없는 달은 29일
  return r ? key(r[0], r[1] - 1, r[2]) : null;
}
const annStart = a => a.y ? key(a.y, a.m - 1, Math.min(a.d, new Date(a.y, a.m, 0).getDate())) : '0000-00-00';
let annCache = {};
function annYearMap(y){
  if (annCache[y]) return annCache[y];
  const map = {};
  getAnn().forEach((a, i) => { if (a.rep !== 'y' && a.rep !== 'o') return;
    for (const yy of [y - 1, y]){ const dk = annDate(a, yy); if (dk && +dk.slice(0, 4) === y) (map[dk] = map[dk] || []).push(i); } });
  return annCache[y] = map;
}
// 그날 보여줄 디데이: [{icon, name}]
function annOn(k){
  const list = getAnn(), out = [], [y, m, d] = k.split('-').map(Number);
  (annYearMap(y)[k] || []).forEach(i => out.push(list[i]));
  list.forEach(a => {
    if (a.rep === 'm' && k >= annStart(a) && d === Math.min(a.d, new Date(y, m, 0).getDate())) out.push(a);
    if (a.rep === 'w' && k >= annStart(a) && (dn(y, m - 1, d) - dn(a.y, a.m - 1, a.d)) % 7 === 0) out.push(a);
  });
  return out;
}
function annNext(a){
  const today = key(T.y, T.m, T.d), st = annStart(a);
  if (a.rep === 'o') return annDate(a, a.y);
  if (a.rep === 'y'){ for (const yy of [T.y - 1, T.y, T.y + 1, T.y + 2]){ const dk = annDate(a, yy); if (dk && dk >= today && dk >= st) return dk; } return null; }
  const from = st > today ? st : today, [fy, fm, fd] = from.split('-').map(Number);
  if (a.rep === 'm'){ for (let i = 0; i < 3; i++){ const yy = fy + Math.floor((fm - 1 + i) / 12), mm = (fm - 1 + i) % 12; const dk = key(yy, mm, Math.min(a.d, new Date(yy, mm + 1, 0).getDate())); if (dk >= from) return dk; } }
  if (a.rep === 'w'){ const diff = dn(fy, fm - 1, fd) - dn(a.y, a.m - 1, a.d); return kOfN(dn(fy, fm - 1, fd) + ((7 - diff % 7) % 7)); }
  return null;
}
const WD = ['일','월','화','수','목','금','토'];
function annWhen(a){
  if (a.rep === 'o') return `${a.cal === 'l' ? '음력 ' : ''}${a.y}.${a.m}.${a.d}`;
  if (a.rep === 'm') return `매월 ${a.d}일`;
  if (a.rep === 'w') return `매주 ${WD[new Date(a.y, a.m - 1, a.d).getDay()]}요일`;
  const yrs = a.y ? T.y - a.y + (annNext(a) && +annNext(a).slice(0, 4) > T.y ? 1 : 0) : 0;
  return `매년 ${a.cal === 'l' ? '음력 ' : ''}${a.m}/${a.d}${a.y ? ` · ${a.y}년부터${yrs > 0 ? ` · ${yrs}년째` : ''}` : ''}`;
}

let sliding = false;
function slide(dm, fromX = 0){
  if (sliding) return; sliding = true;
  const g = document.getElementById('grid'), w = g.offsetWidth;
  g.style.transition = 'transform .16s ease-in, opacity .16s';
  g.style.transform = `translateX(${dm > 0 ? -w * 0.35 : w * 0.35}px)`; g.style.opacity = '0';
  setTimeout(() => {
    move(dm);
    g.style.transition = 'none';
    g.style.transform = `translateX(${dm > 0 ? w * 0.35 : -w * 0.35}px)`;
    void g.offsetWidth;
    g.style.transition = 'transform .22s ease-out, opacity .22s';
    g.style.transform = 'translateX(0)'; g.style.opacity = '1';
    setTimeout(() => { g.style.transition = ''; g.style.transform = ''; g.style.opacity = ''; sliding = false; }, 240);
  }, 160);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState!=='visible') return;
  if (typeof scPull === 'function') scPull();
  const n = new Date(); if (n.getDate()!==T.d){ T={y:n.getFullYear(), m:n.getMonth(), d:n.getDate()}; render(); }
});

// ───── 자동 저장 (GitHub 비공개 저장소, Cloudflare Worker가 대신 저장) ─────
// 페이지에는 GitHub 토큰이 없습니다. 연결 코드로 만든 값(sc-auth)만 폰에 두고, Worker가 확인한 뒤 저장합니다.
const WORKER = 'https://mdd-live.worship3r.workers.dev';
const sc = { sha: '', timer: null, busy: false, again: false, state: '', msg: '' };
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e) {} };
const scAuth = () => lsGet('sc-auth');
const syncedNow = () => !!scAuth() && +(lsGet('sc-last') || 0) >= (S.editedAt || 0);
async function sha256b(str){ return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))); }
const hex = b => [...b].map(x => x.toString(16).padStart(2,'0')).join('');
const b64 = b => btoa(String.fromCharCode(...b));

async function scCall(body){
  const r = await fetch(WORKER + '/scsync', { method:'POST', body: JSON.stringify({ auth: scAuth(), ...body }) });
  let j = {}; try { j = await r.json(); } catch(e) {}
  return { ...j, gh: j.status, status: r.status };
}
let stHide;
function setSt(state, msg){
  // '저장됨·받아옴'은 2.5초 뒤 사라지고, 오류는 계속 보이게
  clearTimeout(stHide);
  if (state === 'ok') stHide = setTimeout(() => { sc.msg = ''; const e = document.getElementById('syncSt'); if (e) e.textContent = ''; }, 2500);
  sc.state = state; sc.msg = msg; sc.full = msg;
  const el = document.getElementById('syncSt'); if (!el) { drawBk(); return; }
  el.className = 'syncst ' + (state === 'ok' ? 'ok' : state === 'err' ? 'err' : '');
  el.textContent = scAuth() ? msg : '';
  const st = document.getElementById('scState'); if (st) st.textContent = msg;
  drawBk();
}
const errMsg = r => r.status === 404 ? 'Cloudflare Worker를 아직 안 바꿨어요'
  : r.status === 401 ? '확인값이 Cloudflare 값과 달라요'
  : r.status === 503 ? 'Cloudflare 설정이 아직 안 됐어요'
  : r.status === 502 && (r.gh === 404 || r.gh === 403 || r.gh === 401) ? 'GitHub 토큰에 저장소 권한이 없어요'
  : r.status === 502 ? 'GitHub 응답 오류 (다시 시도 중)'
  : r.status === 400 ? '저장할 내용 형식 오류' : '저장 안 됨 (다시 시도 중)';

// 열 때·다시 볼 때: GitHub 쪽이 더 새 것이면 받아오고, 폰이 더 새 것이면 올림
async function scPull(first = false){
  if (!scAuth()) return;
  try {
    const r = await scCall({ op:'get' });
    if (!r.ok) return setSt('err', errMsg(r));
    sc.sha = r.sha || '';
    let remote = null; try { remote = r.text ? JSON.parse(r.text) : null; } catch(e) {}
    // 처음 연결할 때 이 폰에도 내용이 있으면 어느 쪽을 쓸지 물어봄
    let takeRemote = remote && remote.types && remote.days && (remote.editedAt || 0) > (S.editedAt || 0);
    if (first && remote && remote.types && remote.days && !takeRemote && S.editedAt) {
      const when = remote.editedAt ? new Date(remote.editedAt).toLocaleString('ko-KR') : '';
      takeRemote = confirm(`GitHub에 저장된 내용이 있어요 (${when}).

확인: GitHub 내용을 불러와요 (이 폰에서 쓴 내용은 없어져요)
취소: 이 폰 내용으로 GitHub를 덮어써요`);
    }
    if (takeRemote) {
      S = remote; save(false); lsSet('sc-last', String(S.editedAt || 0));
      applyShape(); render(); if (document.getElementById('setPage').classList.contains('show')) drawSet();
      setSt('ok', '☁ 받아옴');
    } else if (!remote || (S.editedAt || 0) > (remote.editedAt || 0)) {
      await scPush();
    } else { lsSet('sc-last', String(S.editedAt || 0)); setSt('ok', '☁ 저장됨'); }
  } catch(e) { setSt('err', '인터넷 연결 안 됨'); }
}
function syncSoon(){
  if (!scAuth()) return;
  clearTimeout(sc.timer); setSt('', '☁ 저장 대기');
  sc.timer = setTimeout(scPush, 2500);
}
async function scPush(){
  if (!scAuth()) return;
  if (sc.busy) { sc.again = true; return; }
  sc.busy = true; setSt('', '☁ 저장 중');
  const at = S.editedAt || 0;
  try {
    let r = await scCall({ op:'put', sha: sc.sha, text: JSON.stringify(S) });
    if (r.status === 409) {                       // 다른 곳에서 먼저 저장됨: 최신 sha로 다시
      const g = await scCall({ op:'get' });
      let remote = null; try { remote = g.text ? JSON.parse(g.text) : null; } catch(e) {}
      sc.sha = g.sha || '';
      if (remote && (remote.editedAt || 0) > at) { sc.busy = false; return scPull(); }
      r = await scCall({ op:'put', sha: sc.sha, text: JSON.stringify(S) });
    }
    if (r.ok) { sc.sha = r.sha || sc.sha; lsSet('sc-last', String(at)); setSt('ok', '☁ 저장됨'); }
    else setSt('err', errMsg(r));
  } catch(e) { setSt('err', '인터넷 연결 안 됨'); }
  sc.busy = false;
  if (sc.again || (S.editedAt || 0) > at) { sc.again = false; if (scAuth() && sc.state === 'ok') scPush(); }
}
async function scConnect(code){
  const auth = b64(await sha256b('sc-sync|' + code));
  lsSet('sc-auth', auth);
  drawSc(); await scPull(true);
}
async function drawSc(){
  const box = document.getElementById('scBox'); if (!box) return;
  if (!scAuth()) {
    box.innerHTML = `<div class="small" style="margin-bottom:10px">연결 코드를 넣으면 바꿀 때마다 GitHub에 자동 저장돼요. 폰을 바꿔도 같은 코드로 돌아와요.</div>
      <input class="cfield" id="scCode" type="password" autocomplete="off" placeholder="연결 코드 (8글자 이상)">
      <div class="row2"><button id="scGo">연결</button></div>`;
    document.getElementById('scGo').onclick = () => {
      const v = document.getElementById('scCode').value.trim();
      if (v.length < 8) return alert('연결 코드는 8글자 이상으로 정해 주세요.');
      scConnect(v);
    };
    return;
  }
  const h = hex(await sha256b(scAuth()));
  box.innerHTML = `<div class="sw" style="margin-bottom:10px"><span>상태</span><b id="scState" style="font-size:15px">${esc(sc.full || '확인 중')}</b></div>
    <div class="row2"><button id="scNow">지금 저장</button><button id="scOff">연결 끊기</button></div>
    <div class="small" style="margin-top:10px">처음 한 번: 아래 확인값을 Cloudflare Worker 비밀값 <b>SC_SYNC_HASH</b>에 넣어 주세요.</div>
    <div class="hashbox" id="scHash">${h}</div>
    <div class="row2" style="margin-top:8px"><button id="scCopy">확인값 복사</button></div>`;
  document.getElementById('scNow').onclick = () => scPush();
  document.getElementById('scOff').onclick = () => {
    if (!confirm('이 폰의 자동 저장 연결을 끊을까요? (GitHub에 저장된 내용은 그대로 남아요)')) return;
    lsSet('sc-auth', null); lsSet('sc-last', null); sc.sha = ''; setSt('', ''); drawSc();
  };
  document.getElementById('scCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(h); alert('복사했어요.'); } catch(e) { alert('복사가 안 돼요. 길게 눌러 직접 복사해 주세요.'); }
  };
}
window.addEventListener('online', () => scPull());

applyShape(); render(); drawBk(); scPull();
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
